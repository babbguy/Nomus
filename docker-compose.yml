# Nomus — Docker Compose
#
# Quickstart (localhost):
#   cp engine/.env.example engine/.env      # then edit the secrets in it
#   docker compose pull                     # published images from ghcr.io
#   docker compose up -d
#   -> dashboard  http://localhost:8080
#   -> engine API http://localhost:3100  (GET /health, GET /ready)
#
# NOMUS_VERSION selects the image tag (default: latest), for example
# NOMUS_VERSION=1.2.0 docker compose pull. To build the images from this
# checkout instead, run docker compose up --build.
#
# Optional TLS front proxy (bring your own domain; see docs/admin-guide/deployment.md):
#   export DOMAIN=nomus.example.com
#   docker compose --profile tls run --rm -p 80:80 --entrypoint certbot certbot \
#     certonly --standalone -d "$DOMAIN" --email you@example.com --agree-tos
#   docker compose --profile tls up -d
#
# The engine reads its configuration from engine/.env (see engine/.env.example).
# Third-party images are pinned by digest; Dependabot updates the digests.

name: nomus

services:
  engine:
    image: ghcr.io/babbguy/nomus-engine:${NOMUS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomus-engine
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - nomus-data:/app/data
    env_file:
      - engine/.env
    environment:
      # Container paths; everything else comes from engine/.env.
      NOMUS_DB_PATH: /app/data/nomus.db
    # Health check: built into the image (GET /ready).

  dashboard:
    image: ghcr.io/babbguy/nomus-dashboard:${NOMUS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: nomus-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      engine:
        condition: service_healthy

  # ─── Optional TLS front proxy (profile: tls) ───────────────────────────
  nginx:
    profiles: ["tls"]
    image: nginx:1.30-alpine@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea
    container_name: nomus-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-nomus.example.com}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx-tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - engine
      - dashboard

  certbot:
    profiles: ["tls"]
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    container_name: nomus-certbot
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"]

volumes:
  nomus-data:
    driver: local
