# Nomus — Nginx config for a bare-metal (non-Docker) install
#
# Example only. Replace nomus.example.com with your hostname (infra/setup-vps.sh
# does this for you via $DOMAIN). Assumes the engine listens on 127.0.0.1:3100,
# the dashboard is built to /opt/nomus/dashboard/dist, and certificates are
# issued by certbot.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=nomus_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nomus_auth:10m rate=10r/m;

# Upstream — nomus engine on localhost
upstream nomus_engine {
    server 127.0.0.1:3100;
    keepalive 16;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nomus.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nomus.example.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/nomus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nomus.example.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NomusSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request size limit (ontology imports, file uploads)
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/wasm;

    # ---------------------------------------------------------------
    # API routes — proxied to nomus-engine on :3100
    # ---------------------------------------------------------------

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
        limit_req zone=nomus_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nomus_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # SSE streaming — long-lived connections, no buffering
    location /api/v1/stream {
        proxy_pass http://nomus_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # SSE-critical: disable all buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # GitHub App webhook — no rate limit (verified by HMAC signature)
    location /api/v1/github/webhook {
        proxy_pass http://nomus_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # All other API endpoints — standard rate limit
    location /api/ {
        limit_req zone=nomus_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nomus_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Timeouts for long-running operations (scan, pipeline)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # .well-known — published signing keys
    location /.well-known/ {
        proxy_pass http://nomus_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # ---------------------------------------------------------------
    # Static dashboard — React SPA
    # ---------------------------------------------------------------

    # Hashed static assets — aggressive cache (Vite content-hashed filenames)
    location /assets/ {
        alias /opt/nomus/dashboard/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — serve index.html for all non-API, non-asset routes
    location / {
        root /opt/nomus/dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Don't cache index.html (so deployments take effect immediately)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
