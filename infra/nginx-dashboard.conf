# Dashboard container Nginx config.
# Serves the React SPA and proxies same-origin API calls to the engine
# container (compose service name "engine", port 3100).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for Docker
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # API — the dashboard calls /api/v1/* on its own origin
    location /api/ {
        proxy_pass http://engine:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Server-Sent Events — long-lived, unbuffered
    location /api/v1/stream {
        proxy_pass http://engine:3100;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Published signing keys
    location /.well-known/ {
        proxy_pass http://engine:3100;
        proxy_set_header Host $host;
    }

    # Static assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
