# =============================================================================
# Nomus — CI
# =============================================================================
# Runs on every PR and every push to main and develop. "Release packaging"
# runs what the tag workflows (release.yml, publish.yml) depend on, so a broken
# release is caught before a tag is pushed.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all workspaces
        run: npm run build:all

      - name: Engine tests
        run: npm run test:engine

      - name: Package tests (scanner, github-action, vscode-extension)
        run: npm run test:extensions

      - name: Dashboard tests
        run: npm run test:dashboard

  release-packaging:
    name: Release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Package versions agree
        run: node scripts/check-version.mjs

      - name: CHANGELOG has notes for the current version
        run: node scripts/release-notes.mjs "$(node scripts/check-version.mjs)" --images

      - name: Install dependencies
        run: npm ci

      - name: Build the packages
        run: npm run build:packages && npm run build:vscode-extension

      - name: npm pack --dry-run (scanner, MCP server)
        run: node scripts/check-pack.mjs packages/scanner packages/mcp-server

      - name: vsce package (VS Code extension)
        run: |
          npm run package -w packages/vscode-extension
          ls -l "packages/vscode-extension/nomus-$(node scripts/check-version.mjs).vsix"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Engine image builds (dry run, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Dashboard image builds (dry run, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: false
