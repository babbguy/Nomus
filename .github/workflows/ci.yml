# =============================================================================
# Nomus — CI
# =============================================================================
# Runs on every PR and every push to main.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all workspaces
        run: npm run build:all

      - name: Engine tests
        run: npm run test:engine

      - name: Package tests (scanner, github-action, vscode-extension)
        run: npm run test:extensions
