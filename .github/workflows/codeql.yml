# =============================================================================
# Nomus — CodeQL
# =============================================================================
# Static analysis of the TypeScript/JavaScript sources and of the GitHub
# Actions workflows. Pull requests to develop and main are compared against
# the analysis of their base branch, which pushes to those branches keep
# current; a weekly run picks up new queries. Results: Security > Code scanning.
# =============================================================================

name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The committed Action bundle is generated from packages/ (and its
          # dependencies); the e2e fixtures are sample repositories to scan.
          config: |
            paths-ignore:
              - packages/github-action/dist
              - e2e/fixtures

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
