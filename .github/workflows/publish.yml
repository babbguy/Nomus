# =============================================================================
# Nomus — Publish container images
# =============================================================================
# A v* tag (for example v1.2.0) builds the engine and dashboard images for
# linux/amd64 and linux/arm64 and pushes them to the GitHub Container Registry:
#
#   ghcr.io/babbguy/nomus-engine:1.2.0, :1.2, :latest
#   ghcr.io/babbguy/nomus-dashboard:1.2.0, :1.2, :latest
#
# A pre-release tag (v1.3.0-rc.1) pushes only its own version tag. A manual run
# (workflow_dispatch) is a dry run: it builds both images for both platforms
# and pushes nothing.
#
# Supply chain. Each pushed image (its multi-platform index, by digest) gets:
#   - an SPDX SBOM per platform, generated by BuildKit and stored in the index;
#   - a keyless cosign signature (Sigstore, using this job's GitHub OIDC
#     identity), stored in the registry;
#   - a SLSA build provenance attestation from actions/attest, signed with
#     Sigstore and stored in GitHub's attestation store and in the registry.
# The digest covers the SBOMs, so the signature and the provenance cover them
# too. BuildKit's own provenance is turned off: it is unsigned and would be a
# second provenance record for the same build. Verify commands: SECURITY.md.
# =============================================================================

name: Publish images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Keyless signing (cosign) and provenance (actions/attest) use the job's
      # OIDC token; attestations: write stores the provenance on GitHub.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: nomus-engine
            dockerfile: Dockerfile
            title: Nomus Engine
            description: Nomus regulatory applicability engine (API, pipeline and scheduler)
          - image: nomus-dashboard
            dockerfile: Dockerfile.dashboard
            title: Nomus Dashboard
            description: Nomus web dashboard (Nginx serving the React build and proxying the engine API)
    env:
      PUSH: ${{ github.event_name == 'push' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the package versions
        if: env.PUSH == 'true'
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Put the labels on the multi-platform index too, where GHCR reads them.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # latest follows the newest non-pre-release tag (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/docs/admin-guide/deployment.md
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'

      - name: Sign the image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Build provenance attestation
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records are only available to organization-owned repositories.
          create-storage-record: false
