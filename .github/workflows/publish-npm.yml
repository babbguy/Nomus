# =============================================================================
# Nomus — Publish npm packages
# =============================================================================
# A v* tag (for example v1.2.0) publishes the scanner CLI and the MCP server to
# npm, nomus-scan first because nomus-mcp depends on that exact version:
#
#   npx nomus-scan .          npx -y nomus-mcp
#
# Publishing uses npm trusted publishing: npm exchanges the job's GitHub OIDC
# token for a short-lived credential, so no npm token is stored, and attaches a
# provenance attestation. Each package's trusted publisher on npmjs.com names
# this file (publish-npm.yml) and the environment "npm". A pre-release tag
# (v1.3.0-rc.1) publishes under the "next" dist-tag instead of "latest". A
# version that is already on npm is skipped, so a failed run can be re-run.
#
# A manual run (workflow_dispatch) is a dry run: it builds and checks both
# packages and runs npm publish --dry-run. Nothing is published.
# =============================================================================

name: Publish npm packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm (nomus-scan, nomus-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+. No dependency
      # cache: a release build installs from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Tag matches the package versions
        run: |
          if [ "$PUBLISH" = true ]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the packages
        run: npm run build:packages

      - name: npm pack contents
        run: node scripts/check-pack.mjs packages/scanner packages/mcp-server

      - name: Publish (dry run unless a tag)
        run: |
          version=$(node scripts/check-version.mjs)
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          for ws in packages/scanner packages/mcp-server; do
            name=$(node -p "require('./$ws/package.json').name")
            if [ "$PUBLISH" != true ]; then
              npm publish --workspace="$ws" --tag "$dist_tag" --dry-run
              continue
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
            case "$status" in
              200) echo "::notice title=npm::$name@$version is already on npm; skipped." ;;
              404)
                npm publish --workspace="$ws" --tag "$dist_tag" --provenance
                echo "::notice title=npm::Published $name@$version (dist-tag $dist_tag)." ;;
              *) echo "::error title=npm::The registry answered HTTP $status for $name@$version; nothing published."; exit 1 ;;
            esac
          done
