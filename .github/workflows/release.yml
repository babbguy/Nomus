# =============================================================================
# Nomus — GitHub release
# =============================================================================
# A v* tag (for example v1.2.0) creates the GitHub release for that version:
# notes from the CHANGELOG.md section for the version (plus the docker pull
# commands for the images publish.yml pushes) and the VS Code extension .vsix
# attached. The tag must match the version of every package.
#
# The build job runs third-party code (npm ci, vsce) with a read-only token;
# only the release job, which runs no repository code, can write.
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Tag matches the package versions
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p release
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --images > release/notes.md

      - name: Install dependencies
        run: npm ci

      - name: Package the VS Code extension
        run: |
          npm run build:packages
          npm run build:vscode-extension
          npm run package -w packages/vscode-extension
          mv "packages/vscode-extension/nomus-${GITHUB_REF_NAME#v}.vsix" release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repository's default workflow token is read-only; creating a release
    # needs write access to contents.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Nomus ${{ github.ref_name }}
          body_path: release/notes.md
          files: release/*.vsix
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
