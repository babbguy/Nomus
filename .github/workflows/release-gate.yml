# =============================================================================
# Nomus — Release gate
# =============================================================================
# Builds the product and runs it the way users do (engine on a fresh
# database, production dashboard build, scanner CLI, GitHub Action bundle, MCP
# server, VS Code extension) against a deterministic fake LLM and a fake
# GitHub API. See e2e/README.md. Required check: "Release gate".
# =============================================================================

name: Release gate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (version pinned by package-lock.json)
        run: npx playwright-core install --with-deps chromium

      - name: Build all workspaces
        run: npm run build:all

      # The Action runs from the committed bundle, so the gate must test what
      # ships: the build above must reproduce it exactly.
      - name: Committed GitHub Action bundle matches the source
        run: |
          if ! git diff --quiet -- packages/github-action/dist/index.js; then
            echo "::error file=packages/github-action/dist/index.js::The committed GitHub Action bundle is out of date. Run npm run build:github-action and commit packages/github-action/dist/index.js."
            git diff --stat -- packages/github-action/dist/index.js
            exit 1
          fi

      - name: Run the release gate
        run: node e2e/run-gate.mjs --no-build

      - name: Upload screenshots, logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/out/
            !e2e/out/work/
          if-no-files-found: warn
          retention-days: 14
